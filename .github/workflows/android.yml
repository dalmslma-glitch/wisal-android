name: Build WISAL Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "WisalAndroid/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build WISAL debug APK
        run: gradle --no-daemon -p WisalAndroid :app:assembleDebug

      - name: Print Android signing fingerprints for Firebase
        run: gradle --no-daemon -p WisalAndroid :app:signingReport

      - name: Upload WISAL APK
        uses: actions/upload-artifact@v4
        with:
          name: WISAL-debug-APK
          path: WisalAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
